<div class="process-card">
    <div class="process-card__shape">
        @@include('../svg/_work-process-card-bg.html')
    </div>
    <div class="process-card__info">
        <div class="process-card__content">
            <h2 class="process-card__title">@@title</h2>
            <p class="process-card__desc">@@desc</p>
        </div>
        <div class="process-card__img">
            <img src="../../assets/images/how-it-works/@@img" alt="thumb">
        </div>
    </div>
</div>
