@@include('../layout/_template-top.html')
@@include('../layout/_header.html')
<main>
    <div class="py-120 my-120 container overflow-auto">
        <h1>Calender</h1>
        <div class="booking-calendar" style="--hours:4; --celWidth:200px">
            <div class="booking-calendar-header">
                <span class="name"></span>
                <span> 12AM </span>
                <span> 01AM </span>
                <span> 02AM </span>
                <span> 03AM </span>
            </div>
            <div class="booking-slot">
                <div class="rows-border">
                    <span class="name"></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <div class="booking-list">
                    <div class="booking-item">
                        <span class="name">Sumon</span>
                        <span class="slot booked" style="--min:65; --start-after:60;">
                            Start
                        </span>

                        <span class="slot break" style="--min:140; --start-after:125;">
                            Start
                        </span>

                    </div>
                    <div class="booking-item">
                        <span class="name">Sumon</span>
                        <span class="slot expired" style="--min:42; --start-after:0;">
                            Start
                        </span>

                        <span class="slot complete" style="--min:36; --start-after:45;">
                            Start
                        </span>


                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
<!-- Footer -->
@@include('../layout/_footer.html')
@@include('../layout/_template-bottom.html')
